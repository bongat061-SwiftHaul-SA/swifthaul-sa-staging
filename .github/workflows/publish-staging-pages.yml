name: Publish SwiftHaul staging browser apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swift-haul-staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging publisher
        uses: actions/checkout@v4

      - name: Check out SwiftHaul application staging branch
        uses: actions/checkout@v4
        with:
          repository: bongat061-SwiftHaul-SA/swifthaul-sa
          ref: feature/reference-image-mobile-apps-staging
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build three independent browser apps
        working-directory: source
        run: node scripts/build-pages.cjs

      - name: Verify all three app and portal entry points
        working-directory: source
        run: |
          test -f dist/index.html
          test -f dist/customer/index.html
          test -f dist/driver/index.html
          test -f dist/company/index.html
          test -f dist/customer-portal/index.html
          test -f dist/driver-portal/index.html
          test -f dist/company-portal/index.html
          test -f dist/.nojekyll
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('dist');
          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(file);
            }
          }
          walk(root);
          const missing = [];
          for (const htmlFile of htmlFiles) {
            const html = fs.readFileSync(htmlFile, 'utf8');
            for (const match of html.matchAll(/\b(?:src|href)\s*=\s*["']([^"']+)["']/gi)) {
              const value = match[1].trim();
              if (!value || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#|\?)/i.test(value)) continue;
              const pathname = decodeURIComponent(value.split(/[?#]/, 1)[0]);
              if (!pathname) continue;
              const target = path.resolve(path.dirname(htmlFile), pathname);
              const safe = target === root || target.startsWith(root + path.sep);
              const exists = safe && (fs.existsSync(target) || fs.existsSync(path.join(target, 'index.html')));
              if (!exists) missing.push(path.relative(root, htmlFile) + ' -> ' + value);
            }
          }
          if (missing.length) {
            console.error('Missing local HTML assets or links:');
            for (const item of missing) console.error(' - ' + item);
            process.exit(1);
          }
          console.log('Checked ' + htmlFiles.length + ' HTML pages: all local assets and links resolve.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish staging website
        id: deployment
        uses: actions/deploy-pages@v4
